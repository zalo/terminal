# Drop-in for terminal-server.service installed by scripts/persist/install.sh.
#
# - ExecStartPre runs tm-restore on EVERY start of the server: first boot and
#   the Restart=always relaunch after a crash or an oomd cgroup kill (which
#   takes the tmux servers with it, since they live in this cgroup). Sessions
#   that still exist are skipped, so a routine restart is a no-op. tmux
#   servers spawned here survive later restarts (KillMode=process; verified).
# - ExecStop takes a final snapshot on a clean stop/shutdown (tmux is still
#   alive at that point). It does not run after an abnormal exit, so a crash
#   can't record an empty snapshot.
# - ManagedOOMPreference=avoid: systemd-oomd picks this cgroup only when no
#   other candidate under app.slice exists. Honored for user units because the
#   monitored ancestor (app.slice) and this cgroup share the same owner.
[Service]
ExecStartPre=__REPO_DIR__/scripts/persist/tm-restore
ExecStop=__REPO_DIR__/scripts/persist/tm-snapshot --force
Environment=CONTEXTS_CONFIG=__REPO_DIR__/config/contexts.json
Environment=TERMINAL_RESTORE_AUTORUN=1
ManagedOOMPreference=avoid
